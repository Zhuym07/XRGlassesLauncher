plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("org.jetbrains.kotlin.plugin.compose")
}

// Signing secrets stay in an ignored file on the build machine.
def releaseSigningFile = rootProject.file("keystore.properties")
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def signingKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def hasReleaseSigning = signingKeys.every { releaseSigning.getProperty(it)?.trim() }
if (releaseSigningFile.exists() && !hasReleaseSigning) {
    throw new GradleException("keystore.properties is incomplete. See docs/RELEASING.md; do not use debug signing for a release.")
}

android {
    namespace "com.xrglasses.launcher"

    compileSdk 36

    defaultConfig {
        applicationId "com.xrglasses.launcher"
        minSdk 29
        targetSdk 36
        versionCode 12
        versionName "0.4.7"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseSigning.getProperty("storeFile"))
                storePassword releaseSigning.getProperty("storePassword")
                keyAlias releaseSigning.getProperty("keyAlias")
                keyPassword releaseSigning.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { compose true }
}

// A fresh clone can build debug/tests, but cannot accidentally distribute an unsigned release.
def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    doLast {
        if (!hasReleaseSigning || !rootProject.file(releaseSigning.getProperty("storeFile")).isFile()) {
            throw new GradleException("Release signing is required. Configure local keystore.properties as described in docs/RELEASING.md.")
        }
    }
}
tasks.configureEach {
    if (name in ["assembleRelease", "packageRelease", "bundleRelease", "signReleaseBundle", "validateSigningRelease"]) {
        dependsOn verifyReleaseSigning
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    testImplementation 'junit:junit:4.13.2'
}
