plugins {
    id("com.android.application")
}

android {
    namespace "com.xrglasses.launcher"

    compileSdk 36

    defaultConfig {
        applicationId "com.xrglasses.launcher"
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName "0.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
