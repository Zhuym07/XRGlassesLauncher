<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">XR Desktop</title>
  <desc id="desc">把应用放到眼前，把操控留在手边。右侧为外屏桌面与手机触控板的功能示意。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101C2C"/><stop offset="1" stop-color="#163D46"/>
    </linearGradient>
    <linearGradient id="screen" x2="1" y2="1">
      <stop stop-color="#254B56"/><stop offset="1" stop-color="#132C3A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="1190" cy="40" r="300" stroke="#75C8BC" stroke-opacity=".08" stroke-width="80"/>
  <circle cx="1190" cy="40" r="390" stroke="#75C8BC" stroke-opacity=".05"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
