    <text x="84" y="67" fill="#9CBDBF" font-size="14" font-weight="600" letter-spacing="3">YOUR APPS. A BIGGER VIEW.</text>
    <text x="60" y="161" fill="#E2FFF8" font-size="72" font-weight="700" letter-spacing="-2">XR Desktop</text>
    <text x="64" y="222" fill="#E2FFF8" font-size="29" font-weight="600">把应用放到眼前，把操控留在手边。</text>
    <text x="64" y="263" fill="#A3BFC3" font-size="18">XR 眼镜桌面 × 手机低亮度触控板</text>
    <g fill="#43E8C4" fill-opacity=".12" stroke="#43E8C4" stroke-opacity=".25">
      <rect x="64" y="315" width="116" height="38" rx="19"/>
      <rect x="192" y="315" width="116" height="38" rx="19"/>
      <rect x="320" y="315" width="140" height="38" rx="19"/>
    </g>
    <g fill="#88F4DA" font-size="15" text-anchor="middle">
      <text x="122" y="340">外屏桌面</text><text x="250" y="340">触控操控</text><text x="390" y="340">文字与截图</text>
    </g>
    <rect x="788" y="88" width="412" height="250" rx="20" fill="#07141F" fill-opacity=".5" stroke="#87B3B9" stroke-opacity=".35"/>
